<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Inter, -apple-system, system-ui, sans-serif">
  <!-- background -->
  <rect width="960" height="720" fill="#FFFFFF"/>

  <!-- title -->
  <text x="480" y="56" font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">The Stakes × Politics Matrix</text>
  <text x="480" y="84" font-size="14" fill="#64748B" text-anchor="middle">Pin yourself before you start any synthesis. From The Synthesis Playbook, Ch. 3.</text>

  <!-- Y-axis label (Stakes) - vertical -->
  <text x="36" y="380" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2" transform="rotate(-90, 36, 380)">STAKES</text>

  <!-- Y-axis tick labels -->
  <text x="100" y="262" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">HIGH</text>
  <line x1="108" y1="258" x2="124" y2="258" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="100" y="502" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">LOW</text>
  <line x1="108" y1="498" x2="124" y2="498" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- X-axis label (Politics) - horizontal -->
  <text x="480" y="690" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2">POLITICS</text>

  <!-- X-axis tick labels -->
  <text x="324" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">LOW</text>
  <line x1="324" y1="630" x2="324" y2="615" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="644" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">HIGH</text>
  <line x1="644" y1="630" x2="644" y2="615" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Matrix grid outline -->
  <rect x="160" y="140" width="640" height="480" fill="none" stroke="#0F172A" stroke-width="2"/>
  <line x1="480" y1="140" x2="480" y2="620" stroke="#0F172A" stroke-width="2"/>
  <line x1="160" y1="380" x2="800" y2="380" stroke="#0F172A" stroke-width="2"/>

  <!-- TOP-LEFT: HIGH stakes, LOW politics -->
  <rect x="161" y="141" width="318" height="238" fill="#FEF9C3" opacity="0.55"/>
  <text x="320" y="178" font-size="12" font-weight="700" fill="#854D0E" text-anchor="middle" letter-spacing="0.5">HIGH STAKES · LOW POLITICS</text>
  <line x1="230" y1="192" x2="410" y2="192" stroke="#CA8A04" stroke-width="1" opacity="0.4"/>
  <text x="320" y="228" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">AI on for [CLUSTER]</text>
  <text x="320" y="248" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">and [NARRATE] drafts.</text>
  <text x="320" y="278" font-size="14" fill="#334155" text-anchor="middle">You author</text>
  <text x="320" y="298" font-size="14" fill="#334155" text-anchor="middle">[INTERPRET] and [PRIORITIZE].</text>
  <text x="320" y="340" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. founder-stage discovery sprint,</text>
  <text x="320" y="356" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">technical-decision workshop,</text>
  <text x="320" y="372" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">contained post-mortem</text>

  <!-- TOP-RIGHT: HIGH stakes, HIGH politics — THE HARDEST -->
  <rect x="481" y="141" width="318" height="238" fill="#FEE2E2" opacity="0.65"/>
  <text x="640" y="178" font-size="12" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">HIGH STAKES · HIGH POLITICS</text>
  <text x="640" y="194" font-size="10" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">— the hardest quadrant —</text>
  <line x1="540" y1="208" x2="740" y2="208" stroke="#DC2626" stroke-width="1" opacity="0.4"/>
  <text x="640" y="244" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">AI on for [CLUSTER] only.</text>
  <text x="640" y="276" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Everything else by hand.</text>
  <text x="640" y="316" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. executive offsite,</text>
  <text x="640" y="332" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">board strategy day,</text>
  <text x="640" y="348" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">politically charged post-mortem</text>

  <!-- BOTTOM-LEFT: LOW stakes, LOW politics — THE EASIEST -->
  <rect x="161" y="381" width="318" height="238" fill="#DCFCE7" opacity="0.55"/>
  <text x="320" y="418" font-size="12" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0.5">LOW STAKES · LOW POLITICS</text>
  <line x1="230" y1="432" x2="410" y2="432" stroke="#16A34A" stroke-width="1" opacity="0.4"/>
  <text x="320" y="478" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">AI on for everything.</text>
  <text x="320" y="544" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. routine team retro,</text>
  <text x="320" y="560" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">internal workshop,</text>
  <text x="320" y="576" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">low-pressure ideation</text>

  <!-- BOTTOM-RIGHT: LOW stakes, HIGH politics -->
  <rect x="481" y="381" width="318" height="238" fill="#FEF9C3" opacity="0.55"/>
  <text x="640" y="418" font-size="12" font-weight="700" fill="#854D0E" text-anchor="middle" letter-spacing="0.5">LOW STAKES · HIGH POLITICS</text>
  <line x1="550" y1="432" x2="730" y2="432" stroke="#CA8A04" stroke-width="1" opacity="0.4"/>
  <text x="640" y="468" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">AI on for [CLUSTER]</text>
  <text x="640" y="488" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">and [NARRATE].</text>
  <text x="640" y="518" font-size="14" fill="#334155" text-anchor="middle">Off for [INTERPRET]</text>
  <text x="640" y="538" font-size="14" fill="#334155" text-anchor="middle">and [PRIORITIZE].</text>
  <text x="640" y="576" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. team retro after personnel friction,</text>
  <text x="640" y="592" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">cross-functional alignment with tension</text>

  <!-- footer note -->
  <text x="480" y="712" font-size="11" fill="#94A3B8" text-anchor="middle" font-style="italic">Pin honestly. Don't move quadrants mid-synthesis to justify shortcuts.</text>
</svg>
