<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="960" height="720" fill="#FFFFFF"/>

  <text x="480" y="56" font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">Discovery Synthesis Prioritization</text>
  <text x="480" y="84" font-size="14" fill="#64748B" text-anchor="middle">The Step 6 prioritization filter. From The Synthesis Playbook, Ch. 4.</text>

  <text x="36" y="380" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2" transform="rotate(-90, 36, 380)">EVIDENCE SHARPNESS</text>
  <text x="100" y="262" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">HIGH</text>
  <line x1="108" y1="258" x2="124" y2="258" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="100" y="502" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">LOW</text>
  <line x1="108" y1="498" x2="124" y2="498" stroke="#94A3B8" stroke-width="1.5"/>

  <text x="480" y="690" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2">CLIENT DISCOMFORT</text>
  <text x="324" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">LOW</text>
  <line x1="324" y1="630" x2="324" y2="615" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="644" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">HIGH</text>
  <line x1="644" y1="630" x2="644" y2="615" stroke="#94A3B8" stroke-width="1.5"/>

  <rect x="160" y="140" width="640" height="480" fill="none" stroke="#0F172A" stroke-width="2"/>
  <line x1="480" y1="140" x2="480" y2="620" stroke="#0F172A" stroke-width="2"/>
  <line x1="160" y1="380" x2="800" y2="380" stroke="#0F172A" stroke-width="2"/>

  <!-- TOP-LEFT: high evidence, low discomfort — CONFIRM (yellow) -->
  <rect x="161" y="141" width="318" height="238" fill="#FEF9C3" opacity="0.55"/>
  <text x="320" y="178" font-size="12" font-weight="700" fill="#854D0E" text-anchor="middle" letter-spacing="0.5">CONFIRM</text>
  <line x1="240" y1="192" x2="400" y2="192" stroke="#CA8A04" stroke-width="1" opacity="0.4"/>
  <text x="320" y="232" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Include but de-emphasize.</text>
  <text x="320" y="272" font-size="14" fill="#334155" text-anchor="middle">The client already knew.</text>
  <text x="320" y="320" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. confirmation of an existing</text>
  <text x="320" y="336" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">direction the team agrees with</text>
  <text x="320" y="358" font-size="10" fill="#94A3B8" text-anchor="middle">→ appendix or supporting slide</text>

  <!-- TOP-RIGHT: high evidence, high discomfort — LEAD THE DECK (red) -->
  <rect x="481" y="141" width="318" height="238" fill="#FEE2E2" opacity="0.65"/>
  <text x="640" y="178" font-size="12" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">LEAD THE DECK</text>
  <text x="640" y="194" font-size="10" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">— what the client paid for —</text>
  <line x1="540" y1="208" x2="740" y2="208" stroke="#DC2626" stroke-width="1" opacity="0.4"/>
  <text x="640" y="244" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Strong evidence,</text>
  <text x="640" y="262" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">uncomfortable truth.</text>
  <text x="640" y="290" font-size="14" fill="#334155" text-anchor="middle">The call slide. Slide 3, max.</text>
  <text x="640" y="328" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. positioning-product mismatch,</text>
  <text x="640" y="344" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">the spiky quote anti-flattening surfaced</text>

  <!-- BOTTOM-LEFT: low evidence, low discomfort — FILE (green) -->
  <rect x="161" y="381" width="318" height="238" fill="#DCFCE7" opacity="0.55"/>
  <text x="320" y="418" font-size="12" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0.5">FILE, DON'T SHIP</text>
  <line x1="230" y1="432" x2="410" y2="432" stroke="#16A34A" stroke-width="1" opacity="0.4"/>
  <text x="320" y="478" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Filing, not synthesis.</text>
  <text x="320" y="510" font-size="14" fill="#334155" text-anchor="middle">Customer politeness.</text>
  <text x="320" y="554" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. low-signal observations,</text>
  <text x="320" y="570" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">restated problems, paraphrases</text>

  <!-- BOTTOM-RIGHT: low evidence, high discomfort — FLAG + RESEARCH (yellow) -->
  <rect x="481" y="381" width="318" height="238" fill="#FEF9C3" opacity="0.55"/>
  <text x="640" y="418" font-size="12" font-weight="700" fill="#854D0E" text-anchor="middle" letter-spacing="0.5">FLAG + RESEARCH</text>
  <line x1="550" y1="432" x2="730" y2="432" stroke="#CA8A04" stroke-width="1" opacity="0.4"/>
  <text x="640" y="468" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Provocative hunch,</text>
  <text x="640" y="488" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">thin support.</text>
  <text x="640" y="518" font-size="14" fill="#334155" text-anchor="middle">Appendix. Schedule</text>
  <text x="640" y="538" font-size="14" fill="#334155" text-anchor="middle">follow-up research.</text>
  <text x="640" y="572" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. single interviewee's vivid quote,</text>
  <text x="640" y="588" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">contrarian observation</text>

  <text x="480" y="712" font-size="11" fill="#94A3B8" text-anchor="middle" font-style="italic">The two failures — missing the signal and flattening the dissent — both live here. The deck wins or loses in the upper-right.</text>
</svg>
