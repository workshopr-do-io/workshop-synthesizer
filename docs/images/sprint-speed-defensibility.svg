<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="960" height="720" fill="#FFFFFF"/>

  <text x="480" y="56" font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">Sprint Recommendation Matrix</text>
  <text x="480" y="84" font-size="14" fill="#64748B" text-anchor="middle">The four possible recommendations. From The Synthesis Playbook, Ch. 6 — Step 4.</text>

  <text x="36" y="380" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2" transform="rotate(-90, 36, 380)">PRIMARY KPI (e.g. SPEED)</text>
  <text x="100" y="262" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">SUPPORTED</text>
  <line x1="108" y1="258" x2="124" y2="258" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="100" y="502" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">BROKE</text>
  <line x1="108" y1="498" x2="124" y2="498" stroke="#94A3B8" stroke-width="1.5"/>

  <text x="480" y="690" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2">SECONDARY CONSTRAINT (e.g. AUDIT DEFENSIBILITY)</text>
  <text x="324" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">BROKE</text>
  <line x1="324" y1="630" x2="324" y2="615" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="644" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">SUPPORTED</text>
  <line x1="644" y1="630" x2="644" y2="615" stroke="#94A3B8" stroke-width="1.5"/>

  <rect x="160" y="140" width="640" height="480" fill="none" stroke="#0F172A" stroke-width="2"/>
  <line x1="480" y1="140" x2="480" y2="620" stroke="#0F172A" stroke-width="2"/>
  <line x1="160" y1="380" x2="800" y2="380" stroke="#0F172A" stroke-width="2"/>

  <!-- TOP-LEFT: primary OK, secondary broke — ITERATE (yellow) -->
  <rect x="161" y="141" width="318" height="238" fill="#FEF9C3" opacity="0.55"/>
  <text x="320" y="178" font-size="12" font-weight="700" fill="#854D0E" text-anchor="middle" letter-spacing="0.5">ITERATE BEFORE SHIPPING</text>
  <text x="320" y="194" font-size="10" font-weight="600" fill="#854D0E" text-anchor="middle">— most common outcome —</text>
  <line x1="220" y1="208" x2="420" y2="208" stroke="#CA8A04" stroke-width="1" opacity="0.4"/>
  <text x="320" y="244" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Add a safe parallel mode.</text>
  <text x="320" y="276" font-size="14" fill="#334155" text-anchor="middle">Re-test with N more.</text>
  <text x="320" y="306" font-size="14" fill="#334155" text-anchor="middle">Name an explicit fallback.</text>
  <text x="320" y="344" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. the swipe-or-not case —</text>
  <text x="320" y="360" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">speed wins, audit defensibility doesn't</text>

  <!-- TOP-RIGHT: both supported — SHIP (green) -->
  <rect x="481" y="141" width="318" height="238" fill="#DCFCE7" opacity="0.55"/>
  <text x="640" y="178" font-size="12" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0.5">SHIP THE WINNER</text>
  <text x="640" y="194" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">— rare, the clean case —</text>
  <line x1="540" y1="208" x2="740" y2="208" stroke="#16A34A" stroke-width="1" opacity="0.4"/>
  <text x="640" y="244" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Both hypothesis legs</text>
  <text x="640" y="262" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">cleared in testing.</text>
  <text x="640" y="290" font-size="14" fill="#334155" text-anchor="middle">Ship with minor caveats.</text>
  <text x="640" y="328" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. prototype confirmed</text>
  <text x="640" y="344" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">in 4–5 of 5 sessions</text>

  <!-- BOTTOM-LEFT: both broke — THIRD OPTION (red) -->
  <rect x="161" y="381" width="318" height="238" fill="#FEE2E2" opacity="0.65"/>
  <text x="320" y="418" font-size="12" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">EXPLORE A THIRD OPTION</text>
  <text x="320" y="434" font-size="10" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">— rarest, most valuable —</text>
  <line x1="230" y1="448" x2="410" y2="448" stroke="#DC2626" stroke-width="1" opacity="0.4"/>
  <text x="320" y="484" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Testing reveals</text>
  <text x="320" y="502" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">the room voted on</text>
  <text x="320" y="520" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">the wrong question.</text>
  <text x="320" y="562" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. the engineering lead's</text>
  <text x="320" y="578" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">list-view alternative was right</text>

  <!-- BOTTOM-RIGHT: primary broke, secondary OK — ABANDON THE WINNER (yellow) -->
  <rect x="481" y="381" width="318" height="238" fill="#FEF9C3" opacity="0.55"/>
  <text x="640" y="418" font-size="12" font-weight="700" fill="#854D0E" text-anchor="middle" letter-spacing="0.5">ABANDON THE WINNER</text>
  <line x1="540" y1="432" x2="740" y2="432" stroke="#CA8A04" stroke-width="1" opacity="0.4"/>
  <text x="640" y="468" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Primary claim broke.</text>
  <text x="640" y="498" font-size="14" fill="#334155" text-anchor="middle">The room voted on</text>
  <text x="640" y="518" font-size="14" fill="#334155" text-anchor="middle">a goal it can't deliver.</text>
  <text x="640" y="556" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. concept tests cleanly,</text>
  <text x="640" y="572" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">but doesn't move the metric</text>

  <text x="480" y="712" font-size="11" fill="#94A3B8" text-anchor="middle" font-style="italic">The hypothesis is a conjunction. A break on either leg is a hypothesis-level break. Send Sunday night, not Monday morning.</text>
</svg>
