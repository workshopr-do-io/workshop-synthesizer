<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="960" height="720" fill="#FFFFFF"/>

  <text x="480" y="56" font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">Retro Sticky Triage</text>
  <text x="480" y="84" font-size="14" fill="#64748B" text-anchor="middle">The trust-sticky pattern. From The Synthesis Playbook, Ch. 8.</text>

  <text x="36" y="380" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2" transform="rotate(-90, 36, 380)">DOT-VOTE COUNT</text>
  <text x="100" y="262" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">HIGH</text>
  <line x1="108" y1="258" x2="124" y2="258" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="100" y="502" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">LOW (often 1)</text>
  <line x1="108" y1="498" x2="124" y2="498" stroke="#94A3B8" stroke-width="1.5"/>

  <text x="480" y="690" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2">STRUCTURAL IMPORTANCE</text>
  <text x="324" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">LOW</text>
  <line x1="324" y1="630" x2="324" y2="615" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="644" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">HIGH</text>
  <line x1="644" y1="630" x2="644" y2="615" stroke="#94A3B8" stroke-width="1.5"/>

  <rect x="160" y="140" width="640" height="480" fill="none" stroke="#0F172A" stroke-width="2"/>
  <line x1="480" y1="140" x2="480" y2="620" stroke="#0F172A" stroke-width="2"/>
  <line x1="160" y1="380" x2="800" y2="380" stroke="#0F172A" stroke-width="2"/>

  <!-- TOP-LEFT: high dots, low importance — LOUD BUT SHALLOW (yellow) -->
  <rect x="161" y="141" width="318" height="238" fill="#FEF9C3" opacity="0.55"/>
  <text x="320" y="178" font-size="12" font-weight="700" fill="#854D0E" text-anchor="middle" letter-spacing="0.5">LOUD BUT SHALLOW</text>
  <line x1="220" y1="192" x2="420" y2="192" stroke="#CA8A04" stroke-width="1" opacity="0.4"/>
  <text x="320" y="228" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Room rallied around it</text>
  <text x="320" y="248" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">but won't matter at 90 days.</text>
  <text x="320" y="280" font-size="14" fill="#334155" text-anchor="middle">Acknowledge in write-up.</text>
  <text x="320" y="300" font-size="14" fill="#334155" text-anchor="middle">Don't make it the headline.</text>
  <text x="320" y="340" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. tooling complaint everyone</text>
  <text x="320" y="356" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">votes on but no one actions</text>

  <!-- TOP-RIGHT: high dots, high importance — HEADLINE (green) -->
  <rect x="481" y="141" width="318" height="238" fill="#DCFCE7" opacity="0.55"/>
  <text x="640" y="178" font-size="12" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0.5">HEADLINE</text>
  <line x1="540" y1="192" x2="740" y2="192" stroke="#16A34A" stroke-width="1" opacity="0.4"/>
  <text x="640" y="228" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">The team's collective</text>
  <text x="640" y="248" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">real concern.</text>
  <text x="640" y="280" font-size="14" fill="#334155" text-anchor="middle">Lead the write-up.</text>
  <text x="640" y="300" font-size="14" fill="#334155" text-anchor="middle">Action item attached.</text>
  <text x="640" y="340" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. cross-team handoff process,</text>
  <text x="640" y="356" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">prioritization clarity</text>

  <!-- BOTTOM-LEFT: low dots, low importance — FILING (green/grey) -->
  <rect x="161" y="381" width="318" height="238" fill="#DCFCE7" opacity="0.4"/>
  <text x="320" y="418" font-size="12" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0.5">FILING</text>
  <line x1="280" y1="432" x2="360" y2="432" stroke="#16A34A" stroke-width="1" opacity="0.4"/>
  <text x="320" y="478" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Random stickies.</text>
  <text x="320" y="510" font-size="14" fill="#334155" text-anchor="middle">Skip from write-up.</text>
  <text x="320" y="530" font-size="14" fill="#334155" text-anchor="middle">Park if curious.</text>
  <text x="320" y="572" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. off-topic vents,</text>
  <text x="320" y="588" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">in-jokes, one-line gripes</text>

  <!-- BOTTOM-RIGHT: low dots, high importance — THE TRUST STICKY (red) -->
  <rect x="481" y="381" width="318" height="238" fill="#FEE2E2" opacity="0.65"/>
  <text x="640" y="418" font-size="12" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">THE TRUST STICKY</text>
  <text x="640" y="434" font-size="10" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">— what the dot vote missed —</text>
  <line x1="540" y1="448" x2="740" y2="448" stroke="#DC2626" stroke-width="1" opacity="0.4"/>
  <text x="640" y="484" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Single voice.</text>
  <text x="640" y="504" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Sharp observation.</text>
  <text x="640" y="528" font-size="14" fill="#334155" text-anchor="middle">The unsung dissent.</text>
  <text x="640" y="562" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. "we don't trust each other</text>
  <text x="640" y="578" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">on decisions" (1 dot of 33)</text>

  <text x="480" y="712" font-size="11" fill="#94A3B8" text-anchor="middle" font-style="italic">The 1-dot trust sticky can be the most important sticky on the wall. Surface what the dot vote missed.</text>
</svg>
