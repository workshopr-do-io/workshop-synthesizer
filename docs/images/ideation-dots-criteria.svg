<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="960" height="720" fill="#FFFFFF"/>

  <text x="480" y="56" font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">Ideation Shortlist Matrix</text>
  <text x="480" y="84" font-size="14" fill="#64748B" text-anchor="middle">The dots-vs-criteria tension. From The Synthesis Playbook, Ch. 7 — Step 3.</text>

  <text x="36" y="380" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2" transform="rotate(-90, 36, 380)">DOT-VOTE COUNT</text>
  <text x="100" y="262" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">HIGH</text>
  <line x1="108" y1="258" x2="124" y2="258" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="100" y="502" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">LOW</text>
  <line x1="108" y1="498" x2="124" y2="498" stroke="#94A3B8" stroke-width="1.5"/>

  <text x="480" y="690" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2">CRITERIA SCORE</text>
  <text x="324" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">LOW</text>
  <line x1="324" y1="630" x2="324" y2="615" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="644" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">HIGH</text>
  <line x1="644" y1="630" x2="644" y2="615" stroke="#94A3B8" stroke-width="1.5"/>

  <rect x="160" y="140" width="640" height="480" fill="none" stroke="#0F172A" stroke-width="2"/>
  <line x1="480" y1="140" x2="480" y2="620" stroke="#0F172A" stroke-width="2"/>
  <line x1="160" y1="380" x2="800" y2="380" stroke="#0F172A" stroke-width="2"/>

  <!-- TOP-LEFT: high dots, low criteria — HOT BUT WEAK (yellow) -->
  <rect x="161" y="141" width="318" height="238" fill="#FEF9C3" opacity="0.55"/>
  <text x="320" y="178" font-size="12" font-weight="700" fill="#854D0E" text-anchor="middle" letter-spacing="0.5">HOT BUT WEAK</text>
  <line x1="240" y1="192" x2="400" y2="192" stroke="#CA8A04" stroke-width="1" opacity="0.4"/>
  <text x="320" y="228" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Novelty, executive lean,</text>
  <text x="320" y="248" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">social momentum in room.</text>
  <text x="320" y="278" font-size="14" fill="#334155" text-anchor="middle">Keep at most one</text>
  <text x="320" y="298" font-size="14" fill="#334155" text-anchor="middle">for political signal.</text>
  <text x="320" y="338" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. the AI assistant the CPO</text>
  <text x="320" y="354" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">leaned forward on but criteria reject</text>

  <!-- TOP-RIGHT: high dots, high criteria — HOT AND GOOD (green) -->
  <rect x="481" y="141" width="318" height="238" fill="#DCFCE7" opacity="0.55"/>
  <text x="640" y="178" font-size="12" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0.5">HOT AND GOOD</text>
  <line x1="540" y1="192" x2="740" y2="192" stroke="#16A34A" stroke-width="1" opacity="0.4"/>
  <text x="640" y="228" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Easy includes.</text>
  <text x="640" y="262" font-size="14" fill="#334155" text-anchor="middle">The shortlist's top three.</text>
  <text x="640" y="282" font-size="14" fill="#334155" text-anchor="middle">Non-negotiable.</text>
  <text x="640" y="332" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. the one-click ERP integration</text>
  <text x="640" y="348" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">that scored top + the room loved</text>

  <!-- BOTTOM-LEFT: low dots, low criteria — KILL LIST (green/grey) -->
  <rect x="161" y="381" width="318" height="238" fill="#DCFCE7" opacity="0.4"/>
  <text x="320" y="418" font-size="12" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0.5">COOL AND WEAK</text>
  <line x1="220" y1="432" x2="420" y2="432" stroke="#16A34A" stroke-width="1" opacity="0.4"/>
  <text x="320" y="478" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Kill list.</text>
  <text x="320" y="510" font-size="14" fill="#334155" text-anchor="middle">Don't even discuss</text>
  <text x="320" y="530" font-size="14" fill="#334155" text-anchor="middle">in the readout.</text>
  <text x="320" y="572" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. low-signal stickies,</text>
  <text x="320" y="588" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">in-jokes, off-topic ideas</text>

  <!-- BOTTOM-RIGHT: low dots, high criteria — COOL BUT STRONG (red — the unsung win) -->
  <rect x="481" y="381" width="318" height="238" fill="#FEE2E2" opacity="0.65"/>
  <text x="640" y="418" font-size="12" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">COOL BUT STRONG</text>
  <text x="640" y="434" font-size="10" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">— often the most valuable —</text>
  <line x1="540" y1="448" x2="740" y2="448" stroke="#DC2626" stroke-width="1" opacity="0.4"/>
  <text x="640" y="484" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Proposed late.</text>
  <text x="640" y="504" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Quieter voice.</text>
  <text x="640" y="524" font-size="14" fill="#334155" text-anchor="middle">The unsung win.</text>
  <text x="640" y="562" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. smarter internal search,</text>
  <text x="640" y="578" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">the CS voice's late-session idea</text>

  <text x="480" y="712" font-size="11" fill="#94A3B8" text-anchor="middle" font-style="italic">Top-right and bottom-left are easy. The off-diagonal cells — hot-but-weak, cool-but-strong — are where the synthesis earns its keep.</text>
</svg>
