<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="960" height="720" fill="#FFFFFF"/>

  <text x="480" y="56" font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">Offsite Decision Tiering</text>
  <text x="480" y="84" font-size="14" fill="#64748B" text-anchor="middle">Which artifact carries which decision. From The Synthesis Playbook, Ch. 5.</text>

  <text x="36" y="380" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2" transform="rotate(-90, 36, 380)">DECISION DURABILITY</text>
  <text x="100" y="262" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">COMMITTED</text>
  <line x1="108" y1="258" x2="124" y2="258" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="100" y="502" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">LEANING / OPEN</text>
  <line x1="108" y1="498" x2="124" y2="498" stroke="#94A3B8" stroke-width="1.5"/>

  <text x="480" y="690" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2">POLITICAL SENSITIVITY</text>
  <text x="324" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">LOW</text>
  <line x1="324" y1="630" x2="324" y2="615" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="644" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">HIGH</text>
  <line x1="644" y1="630" x2="644" y2="615" stroke="#94A3B8" stroke-width="1.5"/>

  <rect x="160" y="140" width="640" height="480" fill="none" stroke="#0F172A" stroke-width="2"/>
  <line x1="480" y1="140" x2="480" y2="620" stroke="#0F172A" stroke-width="2"/>
  <line x1="160" y1="380" x2="800" y2="380" stroke="#0F172A" stroke-width="2"/>

  <!-- TOP-LEFT: committed, low political — BOARD DECK + MEMO (green) -->
  <rect x="161" y="141" width="318" height="238" fill="#DCFCE7" opacity="0.55"/>
  <text x="320" y="178" font-size="12" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0.5">BOARD DECK + CEO MEMO</text>
  <line x1="220" y1="192" x2="420" y2="192" stroke="#16A34A" stroke-width="1" opacity="0.4"/>
  <text x="320" y="232" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Public-facing calls.</text>
  <text x="320" y="262" font-size="14" fill="#334155" text-anchor="middle">Committed direction,</text>
  <text x="320" y="282" font-size="14" fill="#334155" text-anchor="middle">no internal friction.</text>
  <text x="320" y="328" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. roadmap shift, budget</text>
  <text x="320" y="344" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">approval, market positioning</text>

  <!-- TOP-RIGHT: committed, high political — CEO MEMO (yellow) -->
  <rect x="481" y="141" width="318" height="238" fill="#FEF9C3" opacity="0.55"/>
  <text x="640" y="178" font-size="12" font-weight="700" fill="#854D0E" text-anchor="middle" letter-spacing="0.5">CEO MEMO ONLY</text>
  <line x1="540" y1="192" x2="740" y2="192" stroke="#CA8A04" stroke-width="1" opacity="0.4"/>
  <text x="640" y="232" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Candid prose.</text>
  <text x="640" y="262" font-size="14" fill="#334155" text-anchor="middle">Committed but not</text>
  <text x="640" y="282" font-size="14" fill="#334155" text-anchor="middle">board-ready.</text>
  <text x="640" y="328" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. executive realignment,</text>
  <text x="640" y="344" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">restructuring named in room</text>

  <!-- BOTTOM-LEFT: leaning, low political — MEMO PARKED LIST (yellow) -->
  <rect x="161" y="381" width="318" height="238" fill="#FEF9C3" opacity="0.55"/>
  <text x="320" y="418" font-size="12" font-weight="700" fill="#854D0E" text-anchor="middle" letter-spacing="0.5">CEO MEMO (PARKED)</text>
  <line x1="230" y1="432" x2="410" y2="432" stroke="#CA8A04" stroke-width="1" opacity="0.4"/>
  <text x="320" y="478" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Leaning calls.</text>
  <text x="320" y="510" font-size="14" fill="#334155" text-anchor="middle">Revisit dates listed.</text>
  <text x="320" y="554" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. pricing experiment</text>
  <text x="320" y="570" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">awaiting data, GTM tweaks</text>

  <!-- BOTTOM-RIGHT: open/leaning, high political — CONFIDENTIAL APPENDIX (red) -->
  <rect x="481" y="381" width="318" height="238" fill="#FEE2E2" opacity="0.65"/>
  <text x="640" y="418" font-size="12" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">CONFIDENTIAL APPENDIX</text>
  <text x="640" y="434" font-size="10" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">— CEO only, never email —</text>
  <line x1="540" y1="448" x2="740" y2="448" stroke="#DC2626" stroke-width="1" opacity="0.4"/>
  <text x="640" y="488" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Political reads.</text>
  <text x="640" y="510" font-size="14" fill="#334155" text-anchor="middle">In-person handoff.</text>
  <text x="640" y="554" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. CRO performance note,</text>
  <text x="640" y="570" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">cultural friction, CEO's pattern</text>

  <text x="480" y="712" font-size="11" fill="#94A3B8" text-anchor="middle" font-style="italic">Altitude mistakes (candid in deck, sanitized in memo) are the failure. Run the Step 7 altitude pass every time.</text>
</svg>
