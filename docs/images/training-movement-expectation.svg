<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Inter, -apple-system, system-ui, sans-serif">
  <rect width="960" height="720" fill="#FFFFFF"/>

  <text x="480" y="56" font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle">Cohort Movement Patterns</text>
  <text x="480" y="84" font-size="14" fill="#64748B" text-anchor="middle">Sub-cohort triage. From The Synthesis Playbook, Ch. 9 — Step 2.</text>

  <text x="36" y="380" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2" transform="rotate(-90, 36, 380)">MOVEMENT (baseline → close)</text>
  <text x="100" y="262" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">HIGH</text>
  <line x1="108" y1="258" x2="124" y2="258" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="100" y="502" font-size="12" font-weight="600" fill="#475569" text-anchor="end" letter-spacing="1">LOW</text>
  <line x1="108" y1="498" x2="124" y2="498" stroke="#94A3B8" stroke-width="1.5"/>

  <text x="480" y="690" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="2">EXPECTATION ALIGNMENT</text>
  <text x="324" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">SURPRISING DIRECTION</text>
  <line x1="324" y1="630" x2="324" y2="615" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="644" y="650" font-size="12" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="1">EXPECTED DIRECTION</text>
  <line x1="644" y1="630" x2="644" y2="615" stroke="#94A3B8" stroke-width="1.5"/>

  <rect x="160" y="140" width="640" height="480" fill="none" stroke="#0F172A" stroke-width="2"/>
  <line x1="480" y1="140" x2="480" y2="620" stroke="#0F172A" stroke-width="2"/>
  <line x1="160" y1="380" x2="800" y2="380" stroke="#0F172A" stroke-width="2"/>

  <!-- TOP-LEFT: high movement, surprising — SURPRISING WIN (red) -->
  <rect x="161" y="141" width="318" height="238" fill="#FEE2E2" opacity="0.65"/>
  <text x="320" y="178" font-size="12" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">SURPRISING WIN</text>
  <text x="320" y="194" font-size="10" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="0.5">— richest stories for one-pager —</text>
  <line x1="220" y1="208" x2="420" y2="208" stroke="#DC2626" stroke-width="1" opacity="0.4"/>
  <text x="320" y="244" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Came in for X,</text>
  <text x="320" y="262" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">left with Y.</text>
  <text x="320" y="290" font-size="14" fill="#334155" text-anchor="middle">Personalized paragraph</text>
  <text x="320" y="310" font-size="14" fill="#334155" text-anchor="middle">+ budget-holder story.</text>
  <text x="320" y="346" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. came in for tactics, left with</text>
  <text x="320" y="362" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">frame-level shift on direct reports</text>

  <!-- TOP-RIGHT: high movement, expected — PROGRAM WORKED (green) -->
  <rect x="481" y="141" width="318" height="238" fill="#DCFCE7" opacity="0.55"/>
  <text x="640" y="178" font-size="12" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="0.5">PROGRAM WORKED AS DESIGNED</text>
  <line x1="490" y1="192" x2="790" y2="192" stroke="#16A34A" stroke-width="1" opacity="0.4"/>
  <text x="640" y="232" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Wanted feedback skills.</text>
  <text x="640" y="252" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Left with feedback skills.</text>
  <text x="640" y="282" font-size="14" fill="#334155" text-anchor="middle">Cohort headline.</text>
  <text x="640" y="302" font-size="14" fill="#334155" text-anchor="middle">Easy personalized para.</text>
  <text x="640" y="340" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. demonstrated the difficult-</text>
  <text x="640" y="356" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">conversations framework on day 2</text>

  <!-- BOTTOM-LEFT: low movement, surprising — MIS-MATCHED (yellow) -->
  <rect x="161" y="381" width="318" height="238" fill="#FEF9C3" opacity="0.55"/>
  <text x="320" y="418" font-size="12" font-weight="700" fill="#854D0E" text-anchor="middle" letter-spacing="0.5">MIS-MATCHED</text>
  <line x1="250" y1="432" x2="390" y2="432" stroke="#CA8A04" stroke-width="1" opacity="0.4"/>
  <text x="320" y="468" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Modest growth,</text>
  <text x="320" y="488" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">unexpected direction.</text>
  <text x="320" y="518" font-size="14" fill="#334155" text-anchor="middle">Worth naming</text>
  <text x="320" y="538" font-size="14" fill="#334155" text-anchor="middle">individually.</text>
  <text x="320" y="572" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. expected promotion path,</text>
  <text x="320" y="588" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">realized doesn't want to manage</text>

  <!-- BOTTOM-RIGHT: low movement, expected — FLAGS (yellow) -->
  <rect x="481" y="381" width="318" height="238" fill="#FEF9C3" opacity="0.55"/>
  <text x="640" y="418" font-size="12" font-weight="700" fill="#854D0E" text-anchor="middle" letter-spacing="0.5">FLAGS SECTION</text>
  <text x="640" y="434" font-size="10" font-weight="700" fill="#854D0E" text-anchor="middle" letter-spacing="0.5">— mandatory naming —</text>
  <line x1="550" y1="448" x2="730" y2="448" stroke="#CA8A04" stroke-width="1" opacity="0.4"/>
  <text x="640" y="484" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">Didn't get what</text>
  <text x="640" y="504" font-size="14" font-weight="600" fill="#0F172A" text-anchor="middle">the program promised.</text>
  <text x="640" y="534" font-size="14" fill="#334155" text-anchor="middle">Honest with program owner.</text>
  <text x="640" y="572" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">e.g. attended reluctantly,</text>
  <text x="640" y="588" font-size="11" font-style="italic" fill="#64748B" text-anchor="middle">family situation ate attention</text>

  <text x="480" y="712" font-size="11" fill="#94A3B8" text-anchor="middle" font-style="italic">Surprising-direction participants and the flags section are the two groups the synthesis must name individually.</text>
</svg>
